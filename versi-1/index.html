<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sebuah hadiah kecil di hari spesialmu." />
  <title>Selamat Ulang Tahun — Untuk Sayang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="locked">

  <!-- ===== GATE: curtain pembuka ===== -->
  <div class="gate" id="gate">
    <div class="gate__inner">
      <svg class="gate__gift" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <rect x="20" y="52" width="80" height="54" rx="8" fill="var(--accent-2)" />
        <rect x="14" y="40" width="92" height="20" rx="6" fill="var(--accent)" />
        <rect x="54" y="40" width="12" height="66" fill="var(--mint)" />
        <path d="M60 40c-8-14-30-16-30-4 0 8 16 10 30 4Z" fill="var(--mint)" />
        <path d="M60 40c8-14 30-16 30-4 0 8-16 10-30 4Z" fill="var(--mint)" />
        <circle cx="60" cy="38" r="7" fill="var(--sky)" />
      </svg>
      <p class="gate__kicker" data-bind="gate.kicker"></p>
      <h1 class="gate__title" data-bind="gate.title"></h1>
      <button class="btn btn--pop magnetic" id="openBtn" type="button">
        <span data-bind="gate.button"></span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
      <p class="gate__hint" data-bind="gate.hint"></p>
    </div>
  </div>

  <!-- ===== Lapisan dekorasi continuous ===== -->
  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>
  <div class="balloons" id="balloons" aria-hidden="true"></div>

  <!-- ===== SITUS ===== -->
  <main class="site" id="site">

    <!-- HERO -->
    <header class="hero" id="hero">
      <div class="hero__text">
        <p class="kicker reveal" style="--i:0">
          <span class="dot"></span>
          <span data-bind="person.date"></span>
        </p>
        <h1 class="hero__title">
          <span class="line reveal" style="--i:1" data-bind="hero.line1"></span>
          <span class="line line--accent reveal" style="--i:2" data-bind="hero.line2"></span>
          <span class="line line--name reveal" style="--i:3" data-bind="person.name"></span>
        </h1>
        <p class="hero__sub reveal" style="--i:4" data-bind="hero.subtitle"></p>
        <div class="hero__actions reveal" style="--i:5">
          <button class="btn btn--solid magnetic" id="heroPlay" type="button">
            <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5Z" /></svg>
            <span data-bind="hero.ctaMusic"></span>
          </button>
          <a class="btn btn--ghost" href="#photos">
            <span data-bind="hero.ctaPhotos"></span>
          </a>
        </div>
      </div>

      <div class="hero__media reveal" style="--i:4">
        <figure class="polaroid polaroid--hero polaroid--float-a" data-tilt>
          <img id="heroPhoto1" alt="" />
          <figcaption data-bind="photos.heroCaption1"></figcaption>
        </figure>
        <figure class="polaroid polaroid--hero polaroid--float-b" data-tilt>
          <img id="heroPhoto2" alt="" />
          <figcaption data-bind="photos.heroCaption2"></figcaption>
        </figure>
      </div>
    </header>

    <!-- MARQUEE -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee__track" id="marqueeTrack"></div>
    </div>

    <!-- GALERI FOTO -->
    <section class="section photos" id="photos">
      <div class="section__head reveal">
        <span class="section__num" data-bind="photos.number"></span>
        <h2 class="section__title" data-bind="photos.title"></h2>
        <p class="section__desc" data-bind="photos.desc"></p>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- SURAT + KARTU BALIK -->
    <section class="section letter" id="letter">
      <div class="letter__grid">
        <div class="letter__sticky reveal">
          <span class="section__num" data-bind="letter.number"></span>
          <h2 class="section__title" data-bind="letter.title"></h2>
          <p class="section__desc" data-bind="letter.desc"></p>
          <p class="letter__tip">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v5a5 5 0 0 1-5 5h-1.6a5 5 0 0 1-3.9-1.9L4.6 15a1.6 1.6 0 0 1 2.4-2.1L9 14.5" />
            </svg>
            <span data-bind="letter.tip"></span>
          </p>
        </div>

        <div class="letter__body">
          <div class="letter__paper reveal" id="letterPaper">
            <p class="letter__typed" id="typedText"></p>
            <span class="letter__cursor" id="typedCursor"></span>
            <p class="letter__sign" data-bind="letter.signature"></p>
          </div>

          <div class="cards" id="cards"></div>
        </div>
      </div>
    </section>

    <!-- ALASAN -->
    <section class="section reasons" id="reasons">
      <div class="section__head reveal">
        <span class="section__num" data-bind="reasons.number"></span>
        <h2 class="section__title" data-bind="reasons.title"></h2>
      </div>
      <ol class="reasons__list" id="reasonsList"></ol>
    </section>

    <!-- FINALE -->
    <section class="section finale" id="finale">
      <p class="finale__kicker reveal" data-bind="finale.kicker"></p>
      <h2 class="finale__title reveal" data-bind="finale.title"></h2>
      <button class="btn btn--danger magnetic" id="dangerBtn" type="button" data-bind="finale.button"></button>
      <p class="finale__warn reveal" data-bind="finale.warn"></p>
    </section>

    <footer class="footer">
      <span data-bind="footer.text"></span>
    </footer>
  </main>

  <!-- ===== MUSIC PLAYER ===== -->
  <div class="player" id="player">
    <div class="player__disc" id="playerDisc" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </div>
    <div class="player__meta">
      <span class="player__title" id="playerTitle"></span>
      <span class="player__artist" id="playerArtist"></span>
    </div>
    <button class="player__btn" id="playBtn" type="button" aria-label="Putar musik">
      <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5Z" /></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7V5Zm6.5 0H17v14h-3.5V5Z" /></svg>
    </button>
    <div class="player__progress" id="progressBar" role="slider" aria-label="Posisi lagu" tabindex="0">
      <div class="player__fill" id="progressFill"></div>
    </div>
    <label class="player__upload" title="Pilih lagu dari perangkat">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2" />
      </svg>
      <input type="file" id="songInput" accept="audio/*" hidden />
    </label>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Tutup">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
    <figure class="lightbox__figure">
      <img id="lightboxImg" alt="" />
      <figcaption id="lightboxCap"></figcaption>
    </figure>
  </div>

  <!-- ===== MODAL PESAN FINAL ===== -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal__box">
      <p class="modal__kicker" data-bind="finale.modalKicker"></p>
      <h3 class="modal__title" data-bind="finale.modalTitle"></h3>
      <p class="modal__body" data-bind="finale.modalBody"></p>
      <button class="btn btn--solid" id="modalClose" type="button" data-bind="finale.modalClose"></button>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
